.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:58px;text-align:center;padding:11px 6px;border-radius:9px;

.hero .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}

.up{color:var(--up)}.dn{color:var(--dn)}.neu{color:var(--no)}.amb{color:var(--amber)}
.hero.lean .big{font-size:24px;font-weight:750;opacity:.9}

.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 14px}
.chip{font-size:11.5px;font-weight:750;letter-spacing:.07em;padding:6px 11px;border-radius:99px;
 border:1px solid var(--line);color:var(--dim);background:var(--card2)}
.chip.ok{color:var(--up);border-color:rgba(37,208,125,.45);background:rgba(37,208,125,.10)}
.chip.warn{color:var(--amber);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.10)}
.chip.bad{color:#fff;border-color:var(--dn);background:rgba(255,92,92,.22)}
.chip.info{color:#8ec5ff;border-color:rgba(74,163,255,.4);background:rgba(74,163,255,.10)}

.wp{margin:0 0 14px}
.wp .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.wp .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.wp .p{font-size:22px;font-weight:800}
.bar{height:6px;border-radius:99px;background:#1a1f28;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#3a4354;left:50%}
.wp .sm{font-size:11px;color:var(--dim2);margin-top:5px}

.sigrow b{color:var(--txt);font-weight:650}
.sep{color:var(--dim2);margin:0 2px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap}

footer{color:var(--dim2);font-size:11px;margin-top:22px;line-height:1.6}
.small{color:var(--dim2);font-size:11.5px}

.tvbox{height:400px;width:100%;overflow:hidden;border-radius:10px}

<script>
const ORDER=["sol","eth","xrp","btc","doge","gold","silver","oil"];
let BOTS=ORDER.slice(0,4);
function botList(){
  const k=Object.keys((SNAP&&SNAP.assets)||{});
  if(!k.length)return BOTS;
  const known=ORDER.filter(a=>k.includes(a));
  const extra=k.filter(a=>!ORDER.includes(a)).sort();
  return known.concat(extra);
}
let SNAP=null, TAB=(location.hash||"#all").slice(1).toLowerCase();

const esc=s=>String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const num=v=>typeof v==="number"&&isFinite(v);
const f=(v,d)=>num(v)?"$"+Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const pc=v=>num(v)?(v*100).toFixed(0)+"%":"—";
const cts=v=>num(v)?(v*100).toFixed(0)+"¢":"—";
function mmss(sec){if(!num(sec))return"—";sec=Math.max(0,Math.round(sec));
  return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
function barColor(p){return p>=0.70?"var(--up)":p>=0.45?"var(--amber)":"var(--dn)";}

/* ---------- paper P&L: find whatever the engine named it, render nothing if absent ---------- */
const PNLKEY=/^(paper_?p(nl|_l|and_?l)?|pnl|paper|p_l|paper_profit|profit)$/i;
function findPnl(o){
  if(!o||typeof o!=="object")return null;
  for(const k of Object.keys(o)){
    if(PNLKEY.test(k)||/pnl/i.test(k)&&!/key/i.test(k)){
      const v=o[k];
      if(num(v))return{total:v,src:o};
      if(v&&typeof v==="object")return{total:pickNum(v,["total","total_cents","net","net_cents","pnl","pnl_cents","cents","dollars","total_dollars"]),obj:v};
    }
  }
  return null;
}
function pickNum(o,keys){for(const k of keys){if(o&&num(o[k]))return o[k];}return null;}
/* cents if the magnitude/name says cents, else dollars */
function pnlText(p){
  if(!p||!num(p.total))return null;
  const o=p.obj||{};
  let v=p.total;
  const dollars=num(o.pnl_dollars)?o.pnl_dollars:(num(o.total_dollars)?o.total_dollars:
    ((o.unit==="cents"||o.total_cents!=null||o.pnl_cents!=null||o.net_cents!=null||Math.abs(v)>=1000)?v/100:v));
  const disp=(dollars<0?"−$":"+$")+Math.abs(dollars).toFixed(2);
  const n=pickNum(o,["n","calls","settled","trades"]);
  const roi=pickNum(o,["roi","return"]);
  const stake=typeof o.stake==="string"?o.stake:(num(o.stake)?"$"+o.stake+"/call":null);
  let sub=[];
  if(stake)sub.push(stake);
  if(num(n))sub.push(n+" settled");
  if(num(roi))sub.push((roi>=0?"+":"−")+Math.abs(roi*100).toFixed(0)+"% ROI");
  return {disp, cls:dollars>=0?"good":"bad", sub:sub.join(" · ")};
}
function pnlHTML(label,src,inline){
  const p=pnlText(findPnl(src));
  if(!p)return "";
  return `<span class="pnl ${p.cls} num">${esc(p.disp)}</span>`+
    (p.sub?` <span class="small">${esc(p.sub)}</span>`:"");
}

/* ---------- record ---------- */
function wrHTML(label,t,extraPnl){
  const pnl=pnlHTML(label,t)||(extraPnl?pnlHTML(label,extraPnl):"");
  if(!t||!t.settled)return `<div class="rec"><b>${esc(label)}</b> — no settled calls`+
    (pnl?` <span class="sep">·</span> ${pnl}`:"")+`</div>`;
  const p=t.win_rate,be=t.breakeven;
  const cls=(num(be)&&p>be)?"good":(p>=0.5?"mid":"bad");
  let h=`<div class="rec"><div class="top"><b>${esc(label)}</b> `+
    `<span class="pct num ${cls}">${pc(p)}</span> `+
    `<span class="num">${t.right}W–${t.wrong}L</span>`;
  if(pnl)h+=` <span class="sep">·</span> ${pnl}`;
  h+=`</div>`;
  let bits=[];
  if(num(be))bits.push("breakeven "+pc(be)+" @ "+cts(t.avg_entry));
  if(num(t.last20))bits.push("last 20: "+pc(t.last20));
  if(t.streak)bits.push(Math.abs(t.streak)+(t.streak>0?"W":"L")+" streak");
  if(bits.length)h+=`<span class="sm num">${esc(bits.join(" · "))}</span>`;
  const T=t.tiers;
  if(T){
    const tq=(n,x)=>x&&x.n?n+" "+x.w+"–"+x.l:null;
    const tb=[tq("strong",T.strong),tq("med",T.medium),tq("flip",T.coin_flip)].filter(Boolean);
    if(tb.length)h+=`<span class="sm num">${esc(tb.join(" · "))}</span>`;
  }
  return h+`</div>`;
}

function pipsHTML(key){
  const rows=(SNAP.recent||{})[key]||[];
  if(!rows.length)return "";
  return `<div class="pips">`+rows.map(r=>`<span class="pip ${r.correct?"w":"l"}"></span>`).join("")+`</div>`;
}

/* ---------- reversal: only when real ---------- */
function reversalHTML(r){
  const rv=r.reversal;
  if(!r.reversal_flag&&!(rv&&rv.flag))return "";
  const level=rv&&rv.level?String(rv.level):"";
  let txt="";
  if(rv&&Array.isArray(rv.reasons)&&rv.reasons.length)txt=rv.reasons.join(" · ");
  else if(r.reversal_text)txt=String(r.reversal_text).replace(/^PROJECTED FLIP INCOMING\s*—\s*/,"");
  if(!txt)return "";
  if(txt.length>180)txt=txt.slice(0,177)+"…";
  const dir=rv&&rv.direction?String(rv.direction).toUpperCase():"";
  const head="FLIP"+(dir?" "+(dir==="UP"?"↑":"↓"):"")+(level&&level!=="watch"?" · "+level.toUpperCase():"");
  return `<div class="alert"><span class="ic">⚠</span><span><b>${esc(head)}</b> — ${esc(txt)}</span></div>`;
}

/* ---------- one compact signal row ---------- */
function sigRow(r){
  const b=[];
  if(num(r.rsi))b.push("RSI "+r.rsi.toFixed(0)+(r.rsi_state?" "+r.rsi_state:""));
  if(r.fvg_distance!=null&&num(r.fvg_distance))b.push("FVG "+Number(r.fvg_distance).toFixed(2)+" away");
  else if(Array.isArray(r.fvgs)&&r.fvgs.length)b.push("FVG open");
  const m=r.momentum_multi||{};
  if(num(m.m3))b.push("mom "+(m.m3>0?"+":"")+m.m3.toFixed(r.dec==null?2:r.dec));
  if(num(r.dist_vol))b.push(r.dist_vol.toFixed(1)+"σ to line");
  if(r.skew&&num(r.skew.yes_mid))b.push("book "+cts(r.skew.yes_mid)+(r.skew.market_dir?" "+String(r.skew.market_dir).toUpperCase():""));
  if(num(r.open_interest))b.push("OI "+Number(r.open_interest).toLocaleString(undefined,{maximumFractionDigits:0}));
  if(!b.length)return "";
  return `<div class="sigrow num">`+b.map(esc).join('<span class="sep">·</span>')+`</div>`;
}

/* ---------- key numbers, one line ---------- */
function keyRow(r){
  const d=r.dec==null?2:r.dec;
  const bits=[];
  bits.push("spot "+f(r.spot,d).replace("$",""));
  bits.push("line "+f(r.target,d).replace("$",""));
  if(num(r.gap))bits.push("gap "+(r.gap>0?"+":"")+f(r.gap,d).replace("$",""));
  if(num(r.band))bits.push("band "+f(r.band,d).replace("$",""));
  return `<div class="sigrow num">`+bits.map(esc).join('<span class="sep">·</span>')+`</div>`;
}

/* ---------- card ---------- */
function card(key,r,rec,full){
  const d=r.dec==null?2:r.dec;
  const head=`<div class="hd"><span class="asset">${esc(r.label)}</span><span class="meta num">`+
    (r.closed||r.error?esc(r.ticker||""):`${mmss(r.secs_left)} left<br>min ${(r.elapsed_min||0).toFixed(1)}`)+
    `</span></div>`;

  if(r.error)return `<div class="card">${head}
    <div class="hero"><div class="big neu">DATA ERROR</div><div class="line2">${esc(r.error)}</div></div>
    ${wrHTML(r.label,rec)}${pipsHTML(key)}</div>`;
  if(r.closed){
    const shut=/closed|not open|no market|no contract/i.test(String(r.note||""))&&!/between/i.test(String(r.note||""));
    return `<div class="card">${head}
    <div class="hero"><div class="big neu">${shut?"MARKET CLOSED":"BETWEEN ROUNDS"}</div>
    <div class="line2 num">last ${f(r.spot,d)}</div></div>
    ${wrHTML(r.label,rec)}${pipsHTML(key)}</div>`;}

  let h=`<div class="card">${head}`;
  const fired=r.fired_call==="UP"||r.fired_call==="DOWN";
  const stoodDown=r.fired_call==="NO CALL";
  const noEdge=r.no_edge===true||r.conviction==="no_edge";

  if(noEdge&&!fired){
    h+=`<div class="hero"><div class="lbl">minute 7</div>
      <div class="big" style="color:#8ec5ff">NO EDGE</div>
      <div class="line2 num">priced ${cts(r.no_edge_price)} — not called</div></div>`;
  }else if(stoodDown){
    h+=`<div class="hero"><div class="lbl">minute ${r.fired_mark==null?7:r.fired_mark}</div>
      <div class="big neu">NO CALL</div>
      <div class="line2">stood down</div></div>`;
  }else if(fired){
    const up=r.fired_call==="UP";
    const fp=num(r.fired_entry_price)?r.fired_entry_price:(num(r.entry_price)?r.entry_price:null);
    const price=num(fp)?("buy "+(up?"YES":"NO")+" "+cts(fp)):(r.fired_price_label||r.price_label||"");
    let l2=`<b class="num">${esc(price)}</b>`;
    if(num(r.edge_points))l2+=` <span class="sep">·</span> edge <b class="num ${r.edge_points>0?"good":"bad"}">${(r.edge_points>0?"+":"")+r.edge_points.toFixed(0)} pts</b>`;
    h+=`<div class="hero"><div class="lbl">the call · minute ${r.fired_mark==null?7:r.fired_mark}</div>
      <div class="big ${up?"up":"dn"}">${up?"↑ UP":"↓ DOWN"}</div>
      <div class="line2">${l2}</div></div>`;
  }else{
    const L=r.expected||{};
    const dir=L.dir;
    h+=`<div class="hero lean"><div class="lbl">pre-7 lean</div>
      <div class="big ${dir==="UP"?"up":dir==="DOWN"?"dn":"neu"}">${dir?(dir==="UP"?"↑ UP":"↓ DOWN"):"no lean"}</div>`;
    const ep=num(L.entry_price)?L.entry_price:(num(r.entry_price)?r.entry_price:r.cand_market_p);
    let l2=[];
    if(num(ep))l2.push("buy "+(L.side||(dir==="UP"?"YES":"NO"))+" "+cts(ep));
    if(num(r.edge_points))l2.push("edge "+(r.edge_points>0?"+":"")+r.edge_points.toFixed(0)+" pts");
    h+=`<div class="line2 num">${esc(l2.join(" · ")||"expected — not recorded")}</div></div>`;
  }

  /* chips: tier + confidence */
  const chips=[];
  const tier=r.tier||r.conviction;
  if(fired&&(tier==="strong"||tier==="medium"||tier==="coin_flip")){
    chips.push(`<span class="chip ${tier==="strong"?"ok":tier==="medium"?"warn":""}">${tier==="coin_flip"?"COIN FLIP":tier.toUpperCase()}</span>`);
  }
  if(fired&&r.confidence){
    const c=r.confidence==="BAIL"?"bad":r.confidence==="HIGH"?"ok":r.confidence==="LOW"?"warn":"";
    chips.push(`<span class="chip ${c}">${esc(r.confidence)}</span>`);
  }
  if(fired&&r.no_edge)chips.push(`<span class="chip info">PRICED ${cts(r.no_edge_price)}</span>`);
  if(chips.length)h+=`<div class="chips">${chips.join("")}</div>`;

  if(fired){
    const p=r.win_prob;
    h+=`<div class="wp"><div class="row"><span class="k">win prob</span>
      <span class="p num" style="color:${num(p)?barColor(p):"var(--dim)"}">${pc(p)}</span></div>
      <div class="bar"><u></u><i style="width:${num(p)?Math.round(p*100):0}%;background:${num(p)?barColor(p):"#333"}"></i></div>
      <div class="sm num">model ${pc(r.win_prob_model)} <span class="sep">·</span> market ${pc(r.win_prob_market)} <span class="sep">·</span> ${mmss(r.secs_left)} left</div></div>`;
  }

  h+=reversalHTML(r);
  h+=keyRow(r);
  h+=sigRow(r);
  h+=wrHTML(r.label,rec,r)+pipsHTML(key);
  return h+`</div>`;
}

/* ---------- log ---------- */
function logHTML(filter){
  let rows=(SNAP.log||[]).filter(r=>!r.is_scalp&&!r.is_lean&&!r.expected&&(r.call==="UP"||r.call==="DOWN"));
  if(filter)rows=rows.filter(r=>String(r.ticker||"").toUpperCase().includes(filter.toUpperCase()));
  rows=rows.slice(0,14);
  if(!rows.length)return `<div class="small">nothing yet</div>`;
  return `<table><thead><tr><th>time</th><th>call</th><th>price</th><th>result</th></tr></thead><tbody>`+
   rows.map(r=>{
    const t=r.ts?new Date(r.ts*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"—";
    const c=r.call==="UP"?"good":r.call==="DOWN"?"bad":"small";
    const res=r.correct==null?`<span class="small">open</span>`:(r.correct?`<span class="good">W</span>`:`<span class="bad">L</span>`);
    return `<tr><td class="num">${t}</td><td class="${c}">${esc(r.call)}</td>`+
      `<td class="num">${num(r.entry_price)?cts(r.entry_price):"—"}</td><td>${res}</td></tr>`;
   }).join("")+`</tbody></table>`;
}

/* ---------- TradingView charts (lazy, one per bot tab) ---------- */
const TVSYM={sol:"COINBASE:SOLUSD",eth:"COINBASE:ETHUSD",xrp:"COINBASE:XRPUSD",btc:"COINBASE:BTCUSD",
  doge:"COINBASE:DOGEUSD",gold:"FX:XAUUSD",silver:"CAPITALCOM:SILVER",oil:"TVC:USOIL"};
function mountChart(tab){
  const wrap=document.getElementById("charts");
  for(const c of wrap.children)c.style.display="none";
  if(!TVSYM[tab])return;
  let el=document.getElementById("chart-"+tab);
  if(!el){
    el=document.createElement("div");
    el.id="chart-"+tab;
    el.className="card chartcard";
    const cfg={symbol:TVSYM[tab],interval:"1",theme:"dark",style:"1",hide_side_toolbar:true,
      allow_symbol_change:false,save_image:false,withdateranges:false,autosize:true};
    const src="https://www.tradingview-widget.com/embed-widget/advanced-chart/?locale=en#"+
      encodeURIComponent(JSON.stringify(cfg));
    el.innerHTML='<h2>'+tab.toUpperCase()+' live chart</h2>'+
      '<div class="tvbox"><iframe src="'+src+'" style="width:100%;height:100%;border:0" '+
      'frameborder="0" allowtransparency="true" scrolling="no" loading="lazy"></iframe></div>';
    wrap.appendChild(el);
  }
  el.style.display="";
}

/* ---------- render ---------- */
function tabsHTML(){
  const mk=(id,label)=>{
    let dotc="";
    if(id!=="all"){
      const r=(SNAP&&SNAP.assets||{})[id]||{};
      const col=r.confidence==="BAIL"?"var(--dn)":r.confidence==="HIGH"?"var(--up)":
        r.confidence==="LOW"?"var(--amber)":(r.closed||r.error)?"var(--dim2)":"#2f3a4a";
      dotc=`<span class="pipdot" style="background:${col}"></span>`;
    }
    return `<button class="tab" role="tab" aria-selected="${TAB===id}" data-tab="${id}">${label}${dotc}</button>`;
  };
  return mk("all","ALL")+botList().map(b=>mk(b,b.toUpperCase())).join("");
}

function render(){
  if(!SNAP)return;
  const age=(Date.now()/1000)-SNAP.generated_at;
  const dot=document.getElementById("dot");
  dot.className="dot"+(age>120?" dead":age>60?" stale":"");
  document.getElementById("clock").textContent=
    `updated ${age<60?Math.round(age)+"s":Math.round(age/60)+"m"} ago`;
  document.getElementById("tabs").innerHTML=tabsHTML();

  const rec=SNAP.record||{}, A=SNAP.assets||{};
  if(TAB!=="all"&&!A[TAB])TAB="all";
  let h="";
  if(TAB==="all"){
    h+=`<div class="card"><h2>Headline record</h2>${wrHTML("ALL BOTS",rec._overall,SNAP)}</div>`;
    botList().forEach(b=>{if(A[b])h+=card(b,A[b],rec[b],false);});
    h+=`<div class="card"><h2>Recent calls</h2>${logHTML(null)}</div>`;
  }else{
    const r=A[TAB];
    h+= r?card(TAB,r,rec[TAB],true):`<div class="card">no data for ${esc(TAB)}</div>`;
    h+=`<div class="card"><h2>${TAB.toUpperCase()} — recent calls</h2>${logHTML(TAB)}</div>`;
  }
  document.getElementById("view").innerHTML=h;
  mountChart(TAB);
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  TAB=b.dataset.tab; location.hash="#"+TAB; render(); window.scrollTo({top:0,behavior:"smooth"});
});
window.addEventListener("hashchange",()=>{
  const t=(location.hash||"#all").slice(1).toLowerCase();
  TAB=t||"all"; render();
});

async function load(){
  try{
    const r=await fetch("snapshot.json?t="+Date.now(),{cache:"no-store"});
    SNAP=await r.json(); render();
  }catch(e){}
}
load(); setInterval(load,10000); setInterval(()=>{if(SNAP)render();},1000);
</script>
